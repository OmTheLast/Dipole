<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Findings and things to try · Dipole</title><style>
@font-face{font-family:"Schibsted Grotesk";font-style:normal;font-weight:400 900;src:url(data:font/woff2;base64,{{font}}) format("woff2")}
:root{
{{tokens}}
}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}a{color:var(--deepblue)}button,a,input{touch-action:manipulation}
:focus-visible{outline:3px solid #e7a934;outline-offset:3px}header{background:var(--ocean);color:var(--foam)}.shell,main{max-width:1090px;padding:0 24px;margin:auto}
header .shell{padding-block:22px 30px}.brand{font-weight:800;color:var(--ice);text-decoration:none}h1{font-size:clamp(32px,6vw,58px);line-height:1.05;margin:26px 0 10px;letter-spacing:-.045em}header p{max-width:64ch;margin:0;color:#cedeeb}
nav{display:flex;flex-wrap:wrap;gap:12px 24px;margin-top:16px}nav a{color:white;text-underline-offset:4px}.search{position:sticky;top:0;z-index:1;background:var(--paper);border-bottom:1px solid var(--line)}.search .shell{display:flex;align-items:center;gap:12px;padding-block:9px}.search input{min-width:0;max-width:480px;flex:1;border:1px solid var(--mist);border-radius:7px;padding:8px 10px;background:white}
section{scroll-margin-top:70px;margin:36px 0 54px}h2{font-size:clamp(26px,4vw,38px);letter-spacing:-.035em;margin:0}.intro{color:var(--mist);margin:4px 0 18px}article{background:white;border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:minmax(0,.83fr) minmax(0,1.17fr);gap:20px;padding:20px;margin:12px 0;align-items:start}
h3{font-size:clamp(19px,2.1vw,25px);line-height:1.22;letter-spacing:-.025em;margin:0}.copy p{margin:10px 0}.action{font-weight:650;display:inline-block;padding-block:7px}figure{margin:0}figure button{width:100%;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--paper);cursor:zoom-in;display:block;overflow:hidden}figure img{width:100%;height:auto;max-height:265px;object-fit:contain;display:block}figcaption{margin-top:6px;color:var(--mist);font-size:13px}
dialog{width:min(1100px,98vw);max-height:94dvh;padding:12px;border:0;border-radius:12px;background:var(--ocean);color:white}dialog::backdrop{background:#07111de0}dialog img{display:block;width:100%;height:min(66dvh,740px);object-fit:contain;touch-action:pinch-zoom}dialog p{margin:8px 0}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar button{min-width:44px;min-height:44px;background:var(--foam);border:0;border-radius:6px;font:inherit;cursor:pointer}.bar #close{margin-left:auto}
[hidden]{display:none!important}@media(max-width:650px){article{grid-template-columns:1fr;padding:15px;gap:8px}.shell,main{padding-inline:14px}header .shell{padding-block:16px 22px}.search label{font-size:14px}section{margin-block:24px 36px}}
</style></head><body><header><div class="shell"><a class="brand" href="../">← Dipole explorer</a><h1>Findings and things to try</h1><p>Compare regional warming, the people living in faster-warming places, and the water stored after the monsoon.</p>
<nav aria-label="Guide contents"><a href="#findings">What are the conclusions?</a><a href="#explore">What should you explore?</a></nav></div></header>
<div class="search" role="search"><div class="shell"><label for="query">Search this guide</label><input type="search" id="query" placeholder="Try Arctic, population or water" autocomplete="off"></div></div>
<main>{{sections}}<p id="empty" role="status" hidden>No matching findings. Try a place, a year or a topic.</p></main>
<dialog aria-label="Enlarged screenshot"><div class="bar"><button id="prev" aria-label="Previous screenshot">←</button><button id="next" aria-label="Next screenshot">→</button><span id="count"></span><button id="close" aria-label="Close screenshot">×</button></div><img id="large" alt=""><p id="caption"></p></dialog>
<script>
const query=document.querySelector('#query'), dialog=document.querySelector('dialog'), cards=[...document.querySelectorAll('article')];
const visible=()=>cards.filter(card=>!card.hidden);
function filter(){const term=query.value.trim().toLowerCase();cards.forEach(card=>card.hidden=!card.dataset.search.includes(term));document.querySelectorAll('main section').forEach(s=>s.hidden=!s.querySelector('article:not([hidden])'));document.querySelector('#empty').hidden=!!visible().length}
query.addEventListener('input',filter);
let active;
function display(card){if(!card)return;active=card;const img=card.querySelector('img');const large=document.querySelector('#large');large.src=img.src;large.alt=img.alt;document.querySelector('#caption').textContent=card.querySelector('figcaption').textContent;document.querySelector('#count').textContent=card.closest('section').querySelector('h2').textContent+' · '+(visible().indexOf(card)+1)+' / '+visible().length;if(!dialog.open)dialog.showModal()}
function move(delta){const list=visible();display(list[(list.indexOf(active)+delta+list.length)%list.length])}
function sectionMove(delta){const list=[...document.querySelectorAll('main section:not([hidden])')];const next=list[(list.indexOf(active.closest('section'))+delta+list.length)%list.length];display(next.querySelector('article:not([hidden])'))}
cards.forEach(card=>card.querySelector('.zoom').onclick=()=>display(card));
document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#close').onclick=()=>dialog.close();
dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const b=dialog.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)dialog.close()});
document.addEventListener('keydown',e=>{if(dialog.open){const actions={ArrowLeft:()=>move(-1),ArrowRight:()=>move(1),ArrowUp:()=>sectionMove(-1),ArrowDown:()=>sectionMove(1)};if(actions[e.key]){e.preventDefault();actions[e.key]()}return}if(e.key==='/'&&document.activeElement!==query){e.preventDefault();query.focus()}if(e.key==='Escape'){query.value='';filter()}});
let start;const image=document.querySelector('#large');image.addEventListener('touchstart',e=>{start=e.touches.length===1?e.touches[0]:null},{passive:true});image.addEventListener('touchcancel',()=>start=null);
image.addEventListener('touchend',e=>{if(!start||e.touches.length)return;const dx=e.changedTouches[0].clientX-start.clientX,dy=e.changedTouches[0].clientY-start.clientY;start=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))move(dx<0?1:-1);else if(dy>60&&dy>Math.abs(dx))dialog.close()},{passive:true});
</script></body></html>
